install:
  - id: linux
    os: "linux"
    label: "Linux / macOS"
    shell: "bash"
    cmd: 'curl -fsSL "https://raw.githubusercontent.com/PentHertz/RF-Swift/refs/heads/main/get_rfswift.sh" | sh'
    note: "Then run rfswift. The script installs the CLI, the Workbench or both, and sets up Docker, Podman or Nix for you."
  - id: mac
    os: "mac"
    label: "macOS (Homebrew / DMG)"
    shell: "zsh"
    cmd: |-
      # Homebrew: CLI and Workbench from the signed release
      brew install --cask penthertz/rfswift/rfswift

      # or the signed and notarized disk image
      curl -LO https://github.com/PentHertz/RF-Swift/releases/latest/download/rfswift_Darwin_universal.dmg && open rfswift_Darwin_universal.dmg
    note: "In the disk image, drag the Workbench to Applications and run Install RF Swift CLI next to it. For USB radios on a Mac, use the Lima engine for containers or the Nix engine to run tools natively."
  - id: windows
    os: "windows"
    label: "Windows"
    shell: "powershell"
    cmd: |-
      $setup = (Invoke-RestMethod https://api.github.com/repos/PentHertz/RF-Swift/releases/latest).assets | Where-Object name -like 'RFSwift-Setup-*-x64.exe'
      Invoke-WebRequest $setup.browser_download_url -OutFile RFSwift-Setup.exe; .\RFSwift-Setup.exe
    note: "One UAC prompt installs WSL 2, USB passthrough, the container engine of your choice or Nix, and RF Swift with its Start Menu entries."

