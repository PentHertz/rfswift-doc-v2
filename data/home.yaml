engines:
  title: "Full toolboxes, or only the tools you use"
  lead: "RF Swift drives four engines with the same commands and the same Workbench. Use a container image for a complete, tested toolbox, or Nix to install nothing you don't use. The installer sets up the one you pick."
  items:
    - { name: "Docker", where: "Linux · macOS · Windows", text: "The most common engine. Every lab is an isolated container, with the fullest USB, serial and realtime support on Linux.", best: "The usual setup, teams, Windows" }
    - { name: "Podman", where: "Linux · macOS · Windows", text: "Rootless and daemonless: labs run as you, with no admin rights and nothing running in the background.", best: "Shared, company or air-gapped machines, small boards" }
    - { name: "Lima", where: "macOS", text: "Containers in a small Linux VM that receives your USB radios, with hot-plug. Optional GPU VM on Apple Silicon.", best: "Containers with USB radios on a Mac" }
    - { name: "Nix", where: "Linux · macOS · Windows", text: "No containers: tools installed natively and pinned. Lazy mode fetches each tool on first use. Direct USB and native sound.", best: "Staying light, macOS, lowest latency" }
  light:
    title: "Stay light with lazy Nix environments"
    text: "In lazy mode nothing is installed up front. Each tool becomes a small launcher that fetches the real tool the first time you run it, then keeps it pinned for good."
    points:
      - { title: "Only what you run", text: "Type sdrpp and only SDR++ is fetched. Run inspectrum next and only that is added. Standard tools come prebuilt from the binary cache." }
      - { title: "Pinned, then instant", text: "Your environment stays on the version you created it from, so nothing changes behind your back. Once fetched, a tool starts straight away." }
      - { title: "In the Workbench too", text: "Pick the Nix engine and tick “Lazy tools (build on first use)” when you create a mission." }
    terminal:
      - { cmd: "rfswift container create --engine nix -i sdr_light -n radio --lazy" }
      - { note: "# nothing installed yet" }
      - { cmd: "sdrpp" }
      - { note: "# first run: only SDR++ is fetched, pinned and started" }
      - { cmd: "inspectrum capture.iq" }
      - { note: "# then only inspectrum is added" }
      - { cmd: "rfswift env run sdr_light sdrpp" }
      - { note: "# or run one tool without creating anything" }
  mac:
    title: "Especially good on a Mac"
    text: "With Nix, the tools run natively on macOS, with no Linux VM in between. Your USB radio opens directly, sound plays natively and OpenGL needs no setup. Add `--isolate` to run them inside Apple's built-in Seatbelt sandbox. Prefer containers? Lima gives them your USB radios, and Docker Desktop or Podman cover everything else."

benefits:
  title: "Spend your time on the signal, not on the setup"
  items:
    - { title: "Ready in minutes", text: "Skip days of compiling and dependency hunting. Hundreds of RF and hardware security tools come already built and tested together, and one command pulls the latest ones." }
    - { title: "One program, no Python", text: "RF Swift itself is a single self-contained binary: no Python, no pip, no virtual environment to manage on your computer. The Workbench is a standalone desktop app." }
    - { title: "Keeps your computer clean", text: "No new OS, no dual boot, no reformatting. Every assessment runs in its own environment that you can throw away." }
    - { title: "Your hardware just works", text: "Your USB devices, sound and display are passed through for you. HydraSDR, HackRF, USRP, bladeRF, Proxmark3, Proxmark5 and many other devices work out of the box." }
    - { title: "Same lab on every machine", text: "Linux, macOS or Windows, on x86_64, ARM64 or RISCV64. From a workstation to a Raspberry Pi or a Steam Deck." }
    - { title: "Stay light", text: "Full images in Docker, Podman or Lima when you want the whole toolbox, or lazy Nix environments where each tool is fetched the first time you run it." }
    - { title: "Covers the whole target", text: "Radio is where it starts, not where it ends. Reversing, Active Directory, network and other assessment tools ship too, so one lab covers the entire target." }
    - { title: "Drive a lab from anywhere", text: "The remote agent is built into the same binary. Run it on a lab server or a small board next to the antenna, and control it from your laptop over mutual TLS." }
    - { title: "From capture to report", text: "The standalone Workbench keeps missions, terminal recordings, notes, findings and captures together, then exports a branded report." }
  compare:
    title: "Works with your distribution, not against it"
    lead: "Dedicated distributions and RF Swift solve different problems, and many people use both. RF Swift installs on Kali, Parrot, BlackArch or DragonOS like on any Linux and adds what they don't ship, without touching their packages. On a plain, freshly installed system, one command brings the whole tool set."
    distro: "A dedicated distribution"
    rfswift: "RF Swift"
  comparison:
    - { row: "Getting started", distro: "Everything is there after one install", rfswift: "One command on the system you already use" }
    - { row: "Kernel and drivers", distro: "Integrated and tested with the system", rfswift: "Uses your computer's kernel" }
    - { row: "Hardware access", distro: "Direct, by default", rfswift: "Passed through for you, or direct with Nix" }
    - { row: "Environments", distro: "One shared system", rfswift: "One environment per job, easy to throw away" }
    - { row: "Platforms", distro: "Mostly x86_64 Linux", rfswift: "Linux, macOS, Windows · x86_64, ARM64, RISC-V64" }
    - { row: "Installing tools", distro: "The whole toolset at once", rfswift: "A toolbox per job, or single tools with lazy Nix" }
    - { row: "Reproducibility", distro: "Depends on local changes", rfswift: "Versioned images, pinned Nix environments" }

