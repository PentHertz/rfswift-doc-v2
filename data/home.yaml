workbench:
  title: "Your whole assessment in one window"
  lead: "A desktop app for everyone who prefers clicking to typing. Create a mission for each engagement, open terminals into your labs, take notes, log findings and captures, then export a branded report."
  standalone:
    title: "Completely standalone"
    text: "A native desktop app, not an editor add-on. No VS Code, no IDE, no plugins, no browser extension. It ships with RF Swift and runs on Linux, macOS and Windows."
  light:
    title: "Full toolboxes or lazy Nix environments"
    text: "Create a mission from a container image, or pick the Nix engine and tick “Lazy tools”: nothing is installed until you run a tool, then only that tool is fetched."
  features:
    - { title: "Missions", text: "One place per engagement, with its own labs and files." }
    - { title: "Recorded terminals", text: "Every session can be replayed later as evidence." }
    - { title: "Notebook & findings", text: "Write notes and rate findings as you work." }
    - { title: "Branded reports", text: "Turn captures and findings into a client-ready report." }

what:
  title: "A ready-made radio lab that runs next to your system, not instead of it"
  text: "Radio tools are hard to install. Each one needs its own drivers, libraries and versions, and they often break each other. RF Swift ships them ready to use, in isolated environments: you pick a toolbox, plug in your radio and start working. When you're done, your computer is exactly as it was. Already on Kali, Parrot or DragonOS? Keep it: RF Swift adds to it."
  steps:
    - { title: "Install once", text: "One installer sets up RF Swift and the engine it needs. No manual Docker setup." }
    - { title: "Pick a toolbox", text: "Images are grouped by job: SDR, Wi-Fi, Bluetooth, telecom, automotive, hardware, reversing, Active Directory and more. Or stay light with a lazy Nix environment that fetches each tool the first time you use it." }
    - { title: "Plug in and listen", text: "Your SDR, audio and display are passed through automatically. Open SDR++, GQRX or GNU Radio and go." }

