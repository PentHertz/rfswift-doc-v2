faq:
  - q: "Do I need to know Docker or Linux?"
    a: "No. The installer sets up the engine for you, and the Workbench lets you create and open labs without typing commands."
  - q: "Should I use the CLI or the Workbench?"
    a: "Either: they manage the same labs. The Workbench adds missions, notes, findings and reports. The command line (CLI) is best for scripting and remote machines."
  - q: "Does the Workbench need VS Code or another editor?"
    a: "No. The Workbench is a completely standalone desktop app: no VS Code, no IDE, no plugins, no browser extension. It installs with RF Swift and needs nothing else."
  - q: "Do I have to download a whole toolbox image?"
    a: "No. A Nix environment in lazy mode installs nothing up front: each tool is fetched the first time you run it, then pinned. Use `--lazy` on the command line or tick **Lazy tools** in the Workbench. To try a single tool without creating anything: `rfswift env run sdr_light sdrpp`."
  - q: "Does it work on Windows and macOS?"
    a: "Yes. On Windows, one installer sets up WSL 2, USB passthrough and the engine. On macOS, use Homebrew or the signed disk image, then pick your engine: Docker Desktop or Podman for containers, Lima when containers need your USB radio, or Nix to run the tools natively. See [known limits](/docs/guide/limitations/) for hardware specifics."
  - q: "Does it replace Kali, Parrot or DragonOS?"
    a: "No, and it isn't meant to. RF Swift runs on the system you already use, those distributions included, and adds tools next to them without touching their packages. Each job simply gets its own environment. [How they compare](/docs/comparisons/)."
  - q: "Do I need Python or other dependencies?"
    a: "No. RF Swift is a single self-contained binary: no Python, pip or virtual environment to manage. The installer adds the engine you choose (Docker, Podman, Lima or Nix) and the few host tools labs need for display and sound."
  - q: "Can I control a lab machine remotely?"
    a: "Yes. The remote agent is built into the same binary. Run it on a lab server or a small board next to your antennas, then drive it from the Workbench on your laptop over mutual TLS. See [Remote agent](/docs/guide/remote-agent/)."
  - q: "Can I use it without internet access?"
    a: "Yes. Follow the [air-gapped installation](/docs/air-gapped-installation/) guide to export images and install them offline."
