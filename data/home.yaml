hero:
  title: "The RF companion for everyone working on radio"
  lead: "Hundreds of radio, hardware and security tools, ready in one command on the computer you already have. From your first FM station to a full professional assessment."
  platforms: ["Linux", "macOS", "Windows", "x86_64 · ARM64 · RISCV64", "Docker · Podman · Lima · Nix"]
  terminal:
    - { cmd: "rfswift container create -i sdr_full -n lab" }
    - { muted: "› Using image penthertz/rfswift_resolute:sdr_full" }
    - { ok: "USB devices forwarded", detail: "HydraSDR, HackRF, USRP, bladeRF, Proxmark3" }
    - { ok: "Audio forwarded", detail: "PipeWire" }
    - { ok: "Display forwarded", detail: "X11" }
    - { ok: "Workspace mounted", detail: "~/rfswift-workspace/lab" }
    - { done: "Start hacking!" }

