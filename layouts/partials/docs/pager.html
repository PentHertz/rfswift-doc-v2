{{- $loc := partial "docs/locate.html" . -}}
{{- if or $loc.prev $loc.next }}
<nav class="pager" aria-label="Previous and next pages">
  {{- with $loc.prev }}
  <a class="pager-link pager-prev" href="{{ .page.RelPermalink }}"><span class="label"><i class="ph ph-arrow-left"></i> Previous</span><span class="pager-title">{{ .title }}</span></a>
  {{- else }}<span></span>{{ end }}
  {{- with $loc.next }}
  <a class="pager-link pager-next" href="{{ .page.RelPermalink }}"><span class="label">Next <i class="ph ph-arrow-right"></i></span><span class="pager-title">{{ .title }}</span></a>
  {{- end }}
</nav>
{{- end }}
