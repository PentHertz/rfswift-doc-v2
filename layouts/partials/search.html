<div class="search-dialog" id="search-dialog" role="dialog" aria-modal="true" aria-label="Search the documentation" hidden>
  <div class="search-backdrop" data-search-close></div>
  <div class="search-panel">
    <div class="search-field">
      <i class="ph ph-magnifying-glass"></i>
      <input type="search" id="search-input" placeholder="Search the docs: install, HackRF, Wi-Fi, Nix, ports…" autocomplete="off" spellcheck="false" aria-controls="search-results" aria-describedby="search-help">
      <button class="btn btn-ghost btn-sm" type="button" data-search-close aria-label="Close search"><kbd>Esc</kbd></button>
    </div>
    <div class="search-results" id="search-results" role="listbox"></div>
    <div class="search-help muted small" id="search-help">
      <span><kbd>↑</kbd> <kbd>↓</kbd> to move</span><span><kbd>Enter</kbd> to open</span><span><kbd>Esc</kbd> to close</span>
    </div>
  </div>
</div>
