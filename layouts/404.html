{{ define "main" }}
<section class="wrap section notfound">
  <div class="stack-lg">
    <span class="kicker">Error 404</span>
    <h1>This frequency is silent</h1>
    <p class="lead">The page you tuned into doesn't exist, or it moved when the docs were reorganised.</p>
    <div class="row">
      <button class="btn btn-primary btn-lg" type="button" data-search-open>Search the docs</button>
      <a class="btn btn-secondary btn-lg" href="{{ "/docs/" | relURL }}">Documentation home</a>
      <a class="btn btn-ghost btn-lg" href="{{ "/" | relURL }}">Home page</a>
    </div>
  </div>
</section>
{{ end }}
