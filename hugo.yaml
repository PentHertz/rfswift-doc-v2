# Configuration
baseURL: "https://rfswift.io/"
title: "RF Swift"
languageCode: "en-us"

enableRobotsTXT: true
enableGitInfo: true
hasCJKLanguage: true

services:
  googleAnalytics:
    ID: G-X1KH5KRN5B

module:
  hugoVersion:
    extended: true
    min: "0.147.0"

# The home page also emits the search index used by the docs search box.
outputFormats:
  SearchIndex:
    mediaType: application/json
    baseName: search-index
    isPlainText: true
    notAlternative: true

outputs:
  home: [HTML, SearchIndex]
  page: [HTML]
  section: [HTML]

taxonomies: {}

markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        block: true
      wrapStandAloneImageWithinParagraph: false
  highlight:
    noClasses: false
    guessSyntax: false
  tableOfContents:
    startLevel: 2
    endLevel: 3

enableInlineShortcodes: true

menu:
  main:
    - name: Workbench
      url: /#workbench
      weight: 1
    - name: Why RF Swift
      url: /#benefits
      weight: 2
    - name: Learn
      url: /#learn
      weight: 3
    - name: Docs
      url: /docs/
      weight: 4
    - name: Commands
      url: /docs/commands/
      weight: 5

params:
  description: "The RF companion for everyone working on radio. Hundreds of radio, hardware and security tools, ready in one command, on the computer you already have."
  releaseLabel: 'v4.0 "Nucleus" is out'
  releaseURL: /docs/release-notes-v4/
  # Logo colour: "original" | "accent" (teal) | "light" | "muted" | "custom" (set --logo-color in main.css)
  logoStyle: accent
  # YouTube video IDs (embedded through youtube-nocookie.com)
  workbenchVideo: "LBUJcKiZVgM"
  demoVideo: "vDInlPsriUg"
  discord: "https://discord.gg/NS3HayKrpA"
  github: "https://github.com/PentHertz/RF-Swift"
  twitter: "https://x.com/PentHertz"
  youtube: "https://www.youtube.com/c/Penthertz"
  # Used by the "Edit this page" link at the bottom of every docs page
  docsRepo: "https://github.com/PentHertz/rfswift-doc-v2"
  docsBranch: "main"
